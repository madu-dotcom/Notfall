<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#c62828" />
  <title>NOTFALLDATEN</title>
  <style>
    :root {
      --bg: #f3f4f6;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --primary: #c62828;
      --primary-dark: #9f1d1d;
      --success: #2e7d32;
      --success-dark: #1f5a26;
      --border: #e5e7eb;
      --shadow: rgba(0, 0, 0, 0.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: linear-gradient(180deg, #f7f7fa 0%, var(--bg) 100%);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.5;
      padding: 20px 14px 40px;
    }

    .container {
      max-width: 520px;
      margin: 0 auto;
    }

    .topbar {
      background: linear-gradient(135deg, var(--primary) 0%, #d32f2f 100%);
      color: white;
      border-radius: 18px;
      padding: 18px 16px;
      text-align: center;
      box-shadow: 0 8px 18px rgba(198, 40, 40, 0.25);
      margin-bottom: 18px;
    }

    .topbar h1 {
      margin: 0;
      font-size: clamp(1.7rem, 5vw, 2.25rem);
      letter-spacing: 0.08em;
      font-weight: 800;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 18px 16px;
      margin-bottom: 18px;
      box-shadow: 0 6px 18px var(--shadow);
    }

    .card h2 {
      margin: 0 0 12px;
      color: var(--primary);
      font-size: 1.15rem;
      border-bottom: 2px solid #f4f4f5;
      padding-bottom: 8px;
    }

    .row {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }

    .label {
      font-weight: 700;
      color: var(--muted);
      min-width: 120px;
    }

    .value {
      flex: 1;
      min-width: 180px;
      color: var(--text);
    }

    .alert {
      color: var(--primary);
      font-weight: 800;
    }

    .call-btn {
      display: block;
      width: 100%;
      background: linear-gradient(180deg, var(--success) 0%, var(--success-dark) 100%);
      color: white;
      text-decoration: none;
      padding: 16px 14px;
      border-radius: 12px;
      font-size: 1.05rem;
      font-weight: 700;
      text-align: center;
      margin-top: 12px;
      box-shadow: 0 8px 16px rgba(46, 125, 50, 0.22);
      transition: transform 0.12s ease, box-shadow 0.12s ease;
    }

    .call-btn:active {
      transform: translateY(1px) scale(0.995);
      box-shadow: 0 5px 10px rgba(46, 125, 50, 0.18);
    }

    .emergency-box {
      border-left: 5px solid var(--primary);
      background: #fff5f5;
      padding: 12px 14px;
      border-radius: 10px;
      margin-top: 12px;
      font-weight: 700;
      color: var(--primary-dark);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="topbar">
      <h1>🚨 NOTFALLDATEN</h1>
    </div>

    <div class="card">
      <h2>Person</h2>
      <div class="row"><div class="label">Name:</div><div class="value">Luisa Dubbel</div></div>
      <div class="row"><div class="label">Geburtsjahr:</div><div class="value">16.04.2020</div></div>

    </div>

    <div class="card">
      <h2>Notfallkontakte</h2>
      <a href="tel:+4915734473796" class="call-btn">📞 Anne (Mutter) anrufen</a>
      <a href="tel:+4915229066374" class="call-btn">📞 Marius (Vater) anrufen</a>
    </div>

    <div class="card">
      <h2>Medizinische Hinweise</h2>
      
      <div class="emergency-box">Bitte anrufen</div>
    </div>
  </div>
</body>
</html>
